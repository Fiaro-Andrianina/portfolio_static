<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Schéma d'une infrastructure réseau Linux : routeur, pare-feu, switch, VLAN, DNS, DHCP et serveur Apache2">
  <defs>
    <pattern id="infra-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E9E9E9" stroke-width="1"/>
    </pattern>
    <linearGradient id="infra-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#infra-fade)"/>
  <rect width="800" height="450" fill="url(#infra-grid)"/>

  <g font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="48" y="54" font-size="15" font-weight="700" letter-spacing="2.4" fill="#111111">INFRASTRUCTURE LINUX</text>
    <text x="48" y="76" font-size="11.5" fill="#777777">VLAN · DNS · DHCP · Apache2</text>

    <g fill="none" stroke="#111111" stroke-width="1.4" opacity="0.38">
      <path d="M400 112v22"/>
      <path d="M400 188v20"/>
      <path d="M400 254v22"/>
      <path d="M400 276v18H190v22"/>
      <path d="M400 276v40"/>
      <path d="M400 276v18h210v22"/>
    </g>

    <!-- Internet -->
    <rect x="330" y="58" width="140" height="54" rx="27" fill="#111111"/>
    <circle cx="357" cy="85" r="4" fill="#22C55E"/>
    <text x="370" y="89" font-size="12" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">INTERNET</text>

    <!-- Routeur / pare-feu -->
    <rect x="306" y="134" width="188" height="54" rx="10" fill="#FFFFFF" stroke="#D8D8D8"/>
    <text x="400" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">Routeur / Pare-feu</text>
    <text x="400" y="174" text-anchor="middle" font-size="10.5" fill="#777777">NAT · règles de filtrage</text>

    <!-- Switch -->
    <rect x="330" y="208" width="140" height="46" rx="9" fill="#FFFFFF" stroke="#D8D8D8"/>
    <text x="400" y="229" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">Switch VLAN</text>
    <text x="400" y="244" text-anchor="middle" font-size="10.5" fill="#777777">802.1Q</text>

    <!-- VLAN 10 -->
    <rect x="120" y="316" width="140" height="58" rx="9" fill="#FFFFFF" stroke="#D8D8D8"/>
    <text x="190" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">VLAN 10 · Admin</text>
    <text x="190" y="357" text-anchor="middle" font-size="10.5" fill="#777777">Postes d'administration</text>

    <!-- VLAN 20 -->
    <rect x="330" y="316" width="140" height="58" rx="9" fill="#FFFFFF" stroke="#D8D8D8"/>
    <text x="400" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">VLAN 20 · Services</text>
    <text x="400" y="357" text-anchor="middle" font-size="10.5" fill="#777777">DNS · DHCP · Apache2</text>

    <!-- VLAN 30 -->
    <rect x="540" y="316" width="140" height="58" rx="9" fill="#FFFFFF" stroke="#D8D8D8"/>
    <text x="610" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">VLAN 30 · Clients</text>
    <text x="610" y="357" text-anchor="middle" font-size="10.5" fill="#777777">Accès contrôlé</text>

    <!-- Légende -->
    <g transform="translate(48 400)">
      <circle cx="4" cy="4" r="4" fill="#22C55E"/>
      <text x="16" y="8" font-size="10.5" fill="#777777">Services actifs et segmentés</text>
    </g>
    <text x="752" y="408" text-anchor="end" font-size="10.5" fill="#999999">Schéma pédagogique</text>
  </g>
</svg>
